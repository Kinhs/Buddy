[package]
name = "buddy"
version = "0.1.0"
description = "Desktop buddy that mirrors your AI coding agent"
edition = "2021"

[lib]
name = "buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde_json = "1"
tiny_http = "0.12"
